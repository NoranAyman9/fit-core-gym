<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      border: 2px solid black;
      margin: 20px;
      font-size: 40px;
    }

    img {
      width: 60px;
      height: 60px;
      border: 2px solid red;
    }

    /* الحالة 1: baseline */
    .baseline img {
      vertical-align: baseline;
    }

    /* الحالة 2: bottom */
    .bottom img {
      vertical-align: bottom;
    }
  </style>
</head>

<body>

  <h2>Baseline</h2>
  <div class="container baseline">
    Hello gyp
    <img src="https://via.placeholder.com/60">
  </div>

  <h2>Bottom</h2>
  <div class="container bottom">
    Hello gyp
    <img src="https://via.placeholder.com/60">
  </div>

</body>
</html>
